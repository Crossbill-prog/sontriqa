name: 03 — Prepare Sontriqa 1.0.0 DRAFT (no binary upload)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/prepare-stable-release-draft.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-draft-only:
    if: github.repository == 'Crossbill-prog/sontriqa'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify release-note bytes, publication hold and complete 11-file digest list
        shell: bash
        run: |
          set -euo pipefail
          echo 'a177d0e5fccfa69eae33b5abe39dbe8a58fe031b93352ff95316b767e5d0368c  docs/RELEASE_NOTES_1_0_0_RU_EN.md' | sha256sum --check --status
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const manifest=JSON.parse(fs.readFileSync('docs/SONTRIQA_1_0_0_RELEASE_MANIFEST.json','utf8'));
          const source=fs.readFileSync('site/release-validator.js','utf8');
          const ctx={window:{}};
          vm.runInNewContext(source,ctx,{timeout:2000});
          const guard=ctx.window.SontriqaReleaseValidator;
          if (!source.includes('const releaseHold=true;') || guard.publicReleaseEnabled ||
              !guard.securityFixApproved || guard.approvedStableTag!=='v1.0.0')
            throw Error('Public download must remain held when creating a draft');
          const approved=guard.approvedAssetSHA256;
          const keys=Object.keys(manifest.publicFiles);
          if(keys.length!==11 || keys.length!==Object.keys(approved).length)
            throw Error('Exactly 11 approved assets required');
          for(const key of keys){
            if(!Object.hasOwn(approved,key)||approved[key]!==manifest.publicFiles[key])
              throw Error('Frozen asset mismatch: '+key);
          }
          if(manifest.immutableInstallerSha256!=='ebcaa560685f16bc6e12f724e47999ce9cb9989212c7681e4c50d590afeada6b')
            throw Error('Original accepted signed Windows EXE changed');
          console.log('Frozen 11 SHA-256 pins, security veto and website hold verified.');
          NODE
      - name: Create DRAFT release (never publish, never upload unreviewed files)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Crossbill-prog/sontriqa
        shell: bash
        run: |
          set -euo pipefail
          if gh api repos/Crossbill-prog/sontriqa/releases/tags/v1.0.0 >/dev/null 2>&1; then
            state="$(gh release view v1.0.0 --json isDraft --jq .isDraft)"
            if [ "$state" != "true" ]; then
              echo 'Existing 1.0.0 is not a draft; never rewrite a published release' >&2
              exit 1
            fi
            echo 'Existing draft v1.0.0 preserved; no files or state changed.'
            exit 0
          fi
          gh release create v1.0.0 --draft --title 'Sontriqa 1.0.0 — Windows x64' --target "${GITHUB_SHA}" --notes-file docs/RELEASE_NOTES_1_0_0_RU_EN.md
          test "$(gh release view v1.0.0 --json isDraft --jq .isDraft)" = true
          echo 'Draft created. Owner must upload ALL 11 exact reviewed assets and authorize final publication. Not published.'
