name: 05 — Publish approved Sontriqa 1.0.0 after verifying 11 exact assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-approved-stable.yml'

permissions:
  contents: write

jobs:
  publish-accepted-stable:
    if: github.repository == 'Crossbill-prog/sontriqa'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 immutable
      - name: Verify exact signed EXE and full public-eligible asset inventory BEFORE publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Crossbill-prog/sontriqa
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Crossbill-prog/sontriqa/releases/436922086 > /tmp/sontriqa-stable-draft.json
          python3 - <<'PY'
          import json,pathlib
          a=json.loads(pathlib.Path('/tmp/sontriqa-stable-draft.json').read_text())
          m=json.loads(pathlib.Path('docs/SONTRIQA_1_0_0_RELEASE_MANIFEST.json').read_text())['publicFiles']
          assert a['id']==436922086 and a['tag_name']=='v1.0.0' and a['draft'] is True
          assert a['prerelease'] is False and len(a['assets'])==11 and len(m)==11
          assert m['Sontriqa-Setup-x64.exe']=='ebcaa560685f16bc6e12f724e47999ce9cb9989212c7681e4c50d590afeada6b'
          assert m['SELECTORS_0.38.0_MPL_SOURCE.zip']=='44a068655cada9bf8746a8a6e853569380c4e4ec2c7b6306e206d1731b83d09b'
          assert m['latest.json']=='3fb48fade9830521256666b70d43e9ff59a9baaffae8b1d6960254dcdb1bbbfd'
          seen=set()
          for asset in a['assets']:
            key=asset['name']
            assert key in m and key not in seen, 'Unexpected or repeated asset '+key
            seen.add(key)
            assert asset.get('state')=='uploaded', key
            assert asset.get('digest')=='sha256:'+m[key], key
            assert asset.get('size',0)>=75, key
          assert seen==set(m)
          notes=a['body']
          assert 'ebcaa560685f16bc6e12f724e47999ce9cb9989212c7681e4c50d590afeada6b' in notes
          assert 'Windows Authenticode' in notes and 'RC.18' in notes
          print('PRE-PUBLICATION VERIFIED: 11/11 exact SHA-256 hashes, patched signed EXE, MPL source, notice and updater manifest')
          PY
      - name: Publish EXACT verified stable release (owner approved in conversation on 6 Nov 2026)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Crossbill-prog/sontriqa
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH repos/Crossbill-prog/sontriqa/releases/436922086 -F draft=false -F prerelease=false --jq '{tag_name,draft,prerelease,html_url}'
      - name: Verify public release API, 11 downloaded files and latest feed (site remains held)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Crossbill-prog/sontriqa
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Crossbill-prog/sontriqa/releases/latest > /tmp/sontriqa-published.json
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('/tmp/sontriqa-published.json').read_text())
          m=json.loads(pathlib.Path('docs/SONTRIQA_1_0_0_RELEASE_MANIFEST.json').read_text())['publicFiles']
          assert r['tag_name']=='v1.0.0' and not r['draft'] and not r['prerelease']
          assert len(r['assets'])==11
          prefix='https://github.com/Crossbill-prog/sontriqa/releases/download/v1.0.0/'
          for a in r['assets']:
            assert a['name'] in m
            assert a['browser_download_url']==prefix+a['name']
            assert a['digest']=='sha256:'+m[a['name']]
          print('PUBLIC STABLE metadata verified. Download source and binary next.')
          PY
          mkdir -p /tmp/sontriqa-public-downloads
          curl --fail --silent --show-error --location --retry 4 --max-time 120 \
            'https://github.com/Crossbill-prog/sontriqa/releases/download/v1.0.0/Sontriqa-Setup-x64.exe' \
            -o /tmp/sontriqa-public-downloads/Sontriqa-Setup-x64.exe
          curl --fail --silent --show-error --location --retry 4 --max-time 120 \
            'https://github.com/Crossbill-prog/sontriqa/releases/download/v1.0.0/SELECTORS_0.38.0_MPL_SOURCE.zip' \
            -o /tmp/sontriqa-public-downloads/SELECTORS_0.38.0_MPL_SOURCE.zip
          curl --fail --silent --show-error --location --retry 4 --max-time 120 \
            'https://github.com/Crossbill-prog/sontriqa/releases/download/v1.0.0/latest.json' \
            -o /tmp/sontriqa-public-downloads/latest.json
          python3 - <<'PY'
          import pathlib,hashlib,json
          m=json.loads(pathlib.Path('docs/SONTRIQA_1_0_0_RELEASE_MANIFEST.json').read_text())['publicFiles']
          d=pathlib.Path('/tmp/sontriqa-public-downloads')
          for name in ['Sontriqa-Setup-x64.exe','SELECTORS_0.38.0_MPL_SOURCE.zip','latest.json']:
            sha=hashlib.sha256((d/name).read_bytes()).hexdigest()
            assert sha==m[name],name+' public URL bytes changed'
          updater=json.loads((d/'latest.json').read_text(encoding='utf-8-sig'))
          assert updater['version']=='1.0.0'
          assert updater['platforms']['windows-x86_64']['url']=='https://github.com/Crossbill-prog/sontriqa/releases/download/v1.0.0/Sontriqa-Setup-x64.exe'
          print('PUBLIC RELEASE VERIFIED: latest.json, signed installer and MPL archive download exact accepted bytes')
          PY
