name: 04 — Recover one stale Pages deployment (one-time)

# One-time recovery of the already FAILED November 5 Pages deployment.
# Never modify Pages settings, publication source or stable release gates.
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/pages-recover-once.yml' ]

permissions:
  contents: read
  pages: write

jobs:
  cancel-stale:
    if: github.repository == 'Crossbill-prog/sontriqa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check exact failed deployment state before any cancellation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STALE_DEPLOYMENT: 242379f2ea4c842ec76d8d5ef1e29efed578d658
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking stale deployment ${STALE_DEPLOYMENT} of ${GH_REPO}"
          if ! status="$(gh api "repos/${GH_REPO}/pages/deployments/${STALE_DEPLOYMENT}" --jq '.status')"; then
            echo "Unable to verify deployment state. No cancellation attempted."
            exit 1
          fi
          echo "Current state: ${status}"
          case "${status}" in
            updating_pages|in_progress|queued|pending)
              echo "The old deployment is stuck and the original workflow already failed."
              gh api --method POST "repos/${GH_REPO}/pages/deployments/${STALE_DEPLOYMENT}/cancel"
              echo "Official GitHub Pages cancel request sent only for the one failed deployment."
              ;;
            succeed|success|failed|failure|canceled|cancelled)
              echo "Old deployment is already terminal: nothing to cancel."
              ;;
            *)
              echo "Unexpected deployment state: no cancellation performed."
              exit 1
              ;;
          esac
