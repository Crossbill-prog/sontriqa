name: 04 — One-shot retry cancellation of orphaned Pages deployment

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/pages-unlock-one-shot.yml' ]

permissions:
  contents: read
  pages: write

jobs:
  unlock:
    if: github.repository == 'Crossbill-prog/sontriqa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Make at most one targeted Pages cancel request for historical failed deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OLD_ID: 242379f2ea4c842ec76d8d5ef1e29efed578d658
        run: |
          set -euo pipefail
          echo "Checking Pages deployment ${OLD_ID} on ${REPOSITORY}"
          state="$(gh api "repos/${REPOSITORY}/pages/deployments/${OLD_ID}" --jq '.status')"
          echo "Pages backend state: ${state}"
          case "${state}" in
            updating_pages|pending|queued|in_progress|deployment_cancelled|canceled|cancelled)
              echo 'Target is historical failed/cancelled Pages deployment. Sending exactly one official cancellation request.'
              gh api --method POST "repos/${REPOSITORY}/pages/deployments/${OLD_ID}/cancel"
              echo 'One historical deployment cancellation was accepted.'
              ;;
            *)
              echo 'No cancellation: unknown or successful deployment state.'
              exit 1
              ;;
          esac
