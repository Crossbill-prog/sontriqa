name: 04 — Stage exact approved Sontriqa 1.0.0 release assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-approved-stable-assets.yml'

permissions:
  contents: write

jobs:
  stage-exact-reviewed-assets:
    if: github.repository == 'Crossbill-prog/sontriqa'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed pinned v4
      - name: Fetch original reviewed 11-file release archive (temporary read-only transfer URL)
        env:
          TRANSFER_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-0bb0-81f4-b9ca-051477594048/raw?se=2026-11-06T19%3A55%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=68b6ca9c-b5bd-5a9b-876d-ee991e2e37a4&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-06T18%3A12%3A32Z&ske=2026-11-07T18%3A12%3A32Z&sks=b&skv=2026-02-06&sig=6SePZbqqEsDnppCb0lrgtcxwIg%2BBhdqY6Fx7CQ8ZWk0%3D'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent --retry 2 --max-time 150 "$TRANSFER_URL" -o /tmp/sontriqa-original-artifact.zip
          python3 - <<'PY'
          import hashlib,os,pathlib,zipfile,json
          root=pathlib.Path.cwd()
          manifest=json.loads((root/'docs/SONTRIQA_1_0_0_RELEASE_MANIFEST.json').read_text('utf-8'))
          hashes=manifest['publicFiles']
          assert len(hashes)==11 and manifest['tag']=='v1.0.0'
          dest=pathlib.Path('/tmp/sontriqa-release-stage')
          dest.mkdir(exist_ok=False)
          with zipfile.ZipFile('/tmp/sontriqa-original-artifact.zip') as z:
            files=z.namelist()
            if len(files)!=11 or set(files)!=set(hashes) or any('/' in f or '\\' in f for f in files):
              raise SystemExit('Unexpected release file set, refusing upload')
            if z.testzip() is not None: raise SystemExit('ZIP CRC verification failed')
            for filename in files:
              (dest/filename).write_bytes(z.read(filename))
          # The private draft notes were authored before owner acceptance;
          # install byte-exact updated bilingual notes from publicly reviewed source.
          (dest/'RELEASE_NOTES_RU_EN.md').write_bytes((root/'docs/RELEASE_NOTES_1_0_0_RU_EN.md').read_bytes())
          for filename,expected in hashes.items():
            actual=hashlib.sha256((dest/filename).read_bytes()).hexdigest()
            if actual!=expected:
              raise SystemExit('Blocked: SHA-256 mismatch for '+filename)
          print('EXACT 11 REVIEWED ASSETS VERIFIED; accepted signed EXE SHA-256='+hashes['Sontriqa-Setup-x64.exe'])
          PY
      - name: Attach exactly 11 checked assets to EXISTING GitHub draft (never publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Crossbill-prog/sontriqa
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view v1.0.0 --json isDraft --jq .isDraft)" = true
          cd /tmp/sontriqa-release-stage
          gh release upload v1.0.0 ./*
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json,subprocess
          manifest=json.load(open('docs/SONTRIQA_1_0_0_RELEASE_MANIFEST.json','r',encoding='utf-8'))['publicFiles']
          response=subprocess.check_output(['gh','api','repos/Crossbill-prog/sontriqa/releases/436922086/assets','--paginate'],text=True)
          assets=json.loads(response)
          assert len(assets)==11, f'Expected 11 release assets, got {len(assets)}'
          for x in assets:
            name=x['name']
            assert name in manifest, name
            assert x.get('state')=='uploaded', name
            assert x.get('digest')=='sha256:'+manifest[name], name+' GitHub digest mismatch'
          print('ALL 11 PUBLIC GITHUB DRAFT ASSETS VERIFIED; RELEASE REMAINS DRAFT')
          PY
