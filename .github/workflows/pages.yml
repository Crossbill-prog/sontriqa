name: 03 — Deploy official download page (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'scripts/generate-site-config.mjs'
      - 'test_site*.mjs'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate repository-specific configuration
        run: node scripts/generate-site-config.mjs "${{ github.repository }}" site/config.js
      - name: Validate public site and both languages
        run: |
          node test_site.mjs
          node test_site_i18n.mjs
          node test_site_release_guard.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # Retrying one job must not generate duplicate github-pages artifacts.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      # One-time recovery for the 4 Nov 2026 GitHub Pages backend deployment
      # that stayed in updating_pages after Actions timed out. No release asset
      # or repository branch is changed by this targeted cancellation.
      - name: Release one known stuck Pages deployment before deploying
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old=6410c9d29e30a0134ab082c8cecf934bf1162ae3
          status="$(gh api "repos/${{ github.repository }}/pages/deployments/$old" --jq '.status' 2>/dev/null || true)"
          case "$status" in
            updating_pages|in_progress|pending|queued|deployment_cancelled)
              gh api --method POST "repos/${{ github.repository }}/pages/deployments/$old/cancel"
              echo "Asked Pages API to cancel stuck deployment: $old (status was $status)"
              # Give GitHub's Pages backend a moment to release its deployment lock.
              sleep 15
              ;;
            *)
              echo "No active stale Pages deployment: ${status:-not-found}"
              ;;
          esac
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
